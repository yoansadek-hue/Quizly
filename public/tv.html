<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quizly TV</title>
<link rel="icon" type="image/png" href="icons/icon-32.png?v=3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;700;800&family=Unbounded:wght@700;800&display=swap" rel="stylesheet">
<style>
  /* Quizly TV — identité « jeton » : un plateau myrtille, des jetons épais, des pièces lettrées A B C D */
  :root{
    --bg:#3b1d8f; --bg-deep:#2c136f; --ink:#1e0f45; --paper:#f6f3ff; --white:#fff;
    --sun:#ffe14d; --mint:#34e3b0; --coral:#ff6b8b; --sky:#62c7ff; --lilac:#c4b8ff; --muted:#5b4a8f;
    --font:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --display:"Unbounded","Figtree",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;height:100%}
  body{font-family:var(--font);font-weight:500;color:var(--paper);overflow:hidden;
    background-color:var(--bg);background-image:radial-gradient(rgba(255,255,255,.075) 1.6px,transparent 1.8px);background-size:30px 30px}
  .screen{position:fixed;inset:0;display:flex;flex-direction:column;padding:4vh 4vw}
  .center{align-items:center;justify-content:center;text-align:center}
  .logo{font:800 clamp(24px,3.2vh,44px) var(--display);margin:0;line-height:1}
  .logo small{display:block;margin-top:.5vh;font:700 .42em var(--font);color:var(--sun)}
  .big{font:800 clamp(34px,7vh,96px) var(--display);line-height:1.05;margin:0;letter-spacing:-.02em}
  .lead{font-size:clamp(16px,2.6vh,32px);color:var(--lilac);margin:1.5vh 0}
  .msg{color:var(--sun);font-weight:800;font-size:clamp(16px,2.6vh,30px);min-height:1.3em}
  .btn{font:800 clamp(16px,2.4vh,28px) var(--display);padding:1.4vh 2.4vw;margin-top:2vh;border:4px solid var(--ink);border-radius:22px;background:var(--sun);color:var(--ink);box-shadow:0 7px 0 var(--ink);cursor:pointer}
  .btn:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ink)}
  .btn.small{font-size:clamp(13px,1.8vh,20px);padding:1vh 1.6vw;margin:0;box-shadow:0 5px 0 var(--ink)}
  .back{position:fixed;left:2vw;bottom:2vh;color:var(--lilac);font:700 clamp(13px,1.6vh,20px) var(--font);text-decoration:none}
  .chip{display:inline-flex;align-items:center;gap:.5em;padding:.35em 1em;border:3px solid var(--ink);border-radius:99px;background:var(--paper);color:var(--ink);font:800 clamp(14px,2.2vh,26px) var(--font);box-shadow:0 4px 0 var(--ink)}
  .avatar{width:1.6em;height:1.6em;border-radius:50%;object-fit:cover;border:3px solid var(--ink);display:inline-grid;place-items:center;font:800 .75em var(--display);color:var(--ink);background:var(--sun);flex:none}
  .avatar.big{width:2.1em;height:2.1em}

  /* salon : à gauche le QR code dans un jeton, à droite les joueurs */
  .lobby{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:5vw;padding:5vh 6vw}
  .lobbyL{display:flex;flex-direction:column;align-items:center;gap:2.6vh;text-align:center}
  .ttl{font:800 clamp(24px,5.4vh,68px) var(--display);margin:0;line-height:1;letter-spacing:-.02em}
  .qr{background:var(--white);border:5px solid var(--ink);border-radius:30px;padding:1.4vh;box-shadow:0 10px 0 var(--ink)}
  .qr.big{width:min(54vh,40vw);height:min(54vh,40vw)}
  .how{font-size:clamp(14px,2.4vh,28px);color:var(--lilac);margin:0}
  .how b{color:var(--paper)}
  .lobbyR{display:flex;flex-direction:column;align-items:flex-start;gap:2.6vh;min-width:0;max-height:90vh;overflow:hidden}
  .info{font:800 clamp(16px,2.8vh,34px) var(--display);margin:0}
  .players{display:flex;flex-wrap:wrap;gap:12px;max-height:46vh;overflow:hidden}
  .players .chip:nth-child(4n+1){background:var(--sun)} .players .chip:nth-child(4n+2){background:var(--mint)}
  .players .chip:nth-child(4n+3){background:var(--coral)} .players .chip:nth-child(4n+4){background:var(--sky)}
  @media (max-aspect-ratio:1/1){.lobby{grid-template-columns:1fr;justify-items:center;text-align:center}.lobbyR{align-items:center}.players{justify-content:center}}

  /* question : une grande carte, puis 4 jetons lettrés */
  .top{display:flex;justify-content:space-between;align-items:center;gap:2vw}
  .who{display:flex;align-items:center;gap:.6em;font:800 clamp(20px,4vh,52px) var(--display);letter-spacing:-.01em}
  .top .chip{background:var(--sky)}
  .bar{height:2vh;background:var(--bg-deep);border:3px solid var(--ink);border-radius:99px;overflow:hidden;margin:2vh 0 0}
  .bar i{display:block;height:100%;background:var(--mint);transform-origin:left}
  .qbox{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:2vh;margin:3vh 0 3.5vh;padding:3vh 4vw;background:var(--paper);color:var(--ink);border:5px solid var(--ink);border-radius:40px;box-shadow:0 12px 0 var(--ink);min-height:0}
  .qtext{font:800 clamp(24px,5.4vh,72px)/1.18 var(--display);white-space:pre-line;margin:0;letter-spacing:-.015em}
  .qimg{max-height:26vh;max-width:60%;object-fit:contain;border-radius:16px;border:4px solid var(--ink);background:var(--white)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:2.2vh 2vw;counter-reset:opt}
  .opt{display:flex;align-items:center;gap:1.4vw;min-height:10vh;padding:1.2vh 1.6vw;background:var(--paper);color:var(--ink);border:4px solid var(--ink);border-radius:28px;box-shadow:0 8px 0 var(--ink);font:700 clamp(18px,3.4vh,44px)/1.15 var(--font);transition:opacity .35s,transform .35s,background .35s}
  .opt::before{counter-increment:opt;content:counter(opt,upper-alpha);flex:none;width:1.9em;height:1.9em;border-radius:50%;display:grid;place-items:center;border:4px solid var(--ink);font:800 .9em var(--display);background:var(--sun)}
  .opt.o1::before{background:var(--mint)} .opt.o2::before{background:var(--coral)} .opt.o3::before{background:var(--sky)}
  .opt.dim{opacity:.3;transform:scale(.97)}
  .opt.right{background:var(--mint);transform:translateY(-6px);box-shadow:0 14px 0 var(--ink)}
  .status{font:800 clamp(16px,3vh,36px) var(--display);color:var(--sun);text-align:center;min-height:1.3em;margin:2vh 0 0}
  .live{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:1.5vh}
  .live .chip.ok{background:var(--mint)}

  /* classements */
  .board{list-style:none;padding:0;margin:3vh auto 0;width:min(1100px,90vw);display:grid;gap:1.4vh}
  .board li{display:flex;align-items:center;gap:1em;padding:1.1vh 1.6vw;background:var(--paper);color:var(--ink);border:4px solid var(--ink);border-radius:24px;box-shadow:0 6px 0 var(--ink);font:800 clamp(18px,3.2vh,40px) var(--display)}
  .board li.first{background:var(--sun)}
  .board .pos{width:1.7em;height:1.7em;display:grid;place-items:center;border-radius:50%;background:var(--ink);color:var(--paper);flex:none;font-size:.8em}
  .board .nm{flex:1;font-family:var(--font)}
  .board .done{opacity:.6}

  /* podium : des piles de jetons */
  .podium{display:flex;align-items:flex-end;justify-content:center;gap:3vw;margin-top:3vh}
  .step{display:flex;flex-direction:column;align-items:center;gap:1vh;font:800 clamp(18px,3vh,40px) var(--display)}
  .step .avatar{font-size:clamp(34px,6.5vh,90px)}
  .step small{font:700 .6em var(--font);color:var(--lilac)}
  .step .block{width:clamp(110px,13vw,250px);border:5px solid var(--ink);border-radius:26px;display:grid;place-items:start center;padding-top:1.4vh;color:var(--ink);font:800 clamp(28px,5vh,70px) var(--display);box-shadow:0 10px 0 var(--ink)}
  .step.p1 .block{height:34vh;background:repeating-linear-gradient(to bottom,var(--sun) 0 3.2vh,#e6c52a 3.2vh 3.7vh)}
  .step.p2 .block{height:24vh;background:repeating-linear-gradient(to bottom,var(--mint) 0 3.2vh,#22c697 3.2vh 3.7vh)}
  .step.p3 .block{height:16vh;background:repeating-linear-gradient(to bottom,var(--coral) 0 3.2vh,#e85676 3.2vh 3.7vh)}
  #tRest{width:min(900px,80vw)}
  #tRest li{font-size:clamp(16px,2.6vh,30px);padding:.8vh 1.4vw}

  /* réactions des joueurs */
  .bubble{position:fixed;bottom:6vh;z-index:20;display:flex;gap:.4em;align-items:center;padding:.5em 1.1em;border:4px solid var(--ink);border-radius:999px;box-shadow:0 6px 0 var(--ink);color:var(--ink);font:800 clamp(18px,3vh,36px) var(--display);pointer-events:none;animation:floatup 3s ease-out forwards}
  .bubble b{font-family:var(--font)}
  .bubble.r0{background:var(--sun)} .bubble.r1{background:var(--mint)} .bubble.r2{background:var(--coral)} .bubble.r3{background:var(--sky)} .bubble.r4{background:var(--paper)}
  @keyframes floatup{0%{transform:translateY(20px) scale(.6);opacity:0}12%{transform:none;opacity:1}100%{transform:translateY(-55vh) rotate(-6deg);opacity:0}}
  @keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
  .screen:not([hidden]) .qbox,.screen:not([hidden]) .step,.players .chip{animation:pop .45s backwards}
  .step.p1{animation-delay:.5s} .step.p2{animation-delay:.25s}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- 1. Connexion (la télé crée son propre salon) -->
<section id="tJoin" class="screen center">
  <p class="logo">Quizly TV<small>par YoskanGame</small></p>
  <p class="lead" id="tMsg">Préparation du salon télé…</p>
  <button class="btn" id="tGo" hidden>Réessayer</button>
</section>

<!-- 2. Salle d'attente -->
<section id="tLobby" class="screen lobby" hidden>
  <!-- à gauche : le QR code ; à droite : les joueurs -->
  <div class="lobbyL">
    <p class="ttl">Scannez pour jouer</p>
    <img id="tQr" class="qr big" alt="QR code pour rejoindre">
    <p class="how">Appli Quizly › <b>En ligne</b> › <b>Scanner la télé</b></p>
  </div>
  <div class="lobbyR">
    <p class="logo">Quizly<small>par YoskanGame</small></p>
    <p class="info" id="tLobbyInfo"></p>
    <div class="players" id="tPlayers"></div>
    <p class="msg" id="tWait">En attente du premier joueur…</p>
    <button class="btn small" id="tSound">Activer le son</button>
  </div>
  <a class="back" href="./">← Retour à Quizly</a>
</section>

<!-- 3. Chargement / messages -->
<section id="tLoad" class="screen center" hidden>
  <p class="big" id="tLoadText">Préparation…</p>
</section>

<!-- 4. Question (Survie et Millionnaire) -->
<section id="tQuestion" class="screen" hidden>
  <div class="top">
    <div class="who" id="tWho"></div>
    <span class="chip" id="tTag"></span>
  </div>
  <div class="bar" id="tBarBox"><i id="tBar"></i></div>
  <div class="qbox">
    <img id="tImg" class="qimg" alt="" hidden>
    <p class="qtext" id="tText"></p>
    <audio id="tAudio" preload="auto"></audio>
  </div>
  <div class="grid" id="tOpts"></div>
  <p class="status" id="tStatus"></p>
  <div class="live" id="tLive"></div>
</section>

<!-- 5. Chrono : classement en direct -->
<section id="tChrono" class="screen" hidden>
  <div class="top"><p class="big">Chrono 60 s</p><span class="chip" id="tChronoInfo"></span></div>
  <ol class="board" id="tBoard"></ol>
</section>

<!-- 6. Choix du niveau -->
<section id="tLevel" class="screen center" hidden>
  <p class="lead">Fin du tour</p>
  <p class="big" id="tLevelText"></p>
  <p class="msg">L'hôte choisit la suite…</p>
</section>

<!-- 7. Podium -->
<section id="tEnd" class="screen center" hidden>
  <p class="lead" id="tEndLead">Vainqueur</p>
  <p class="big" id="tWinner"></p>
  <div class="podium" id="tPodium"></div>
  <ol class="board" id="tRest"></ol>
</section>

<script type="module" src="js/tv.js"></script>
</body>
</html>
